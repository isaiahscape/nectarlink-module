# SPDX-License-Identifier: GPL-3.0-or-later
name: Build Flashable Module

on:
  push:
    tags: ["v*"]
  schedule:
    # Poll thtbee/nectarlink releases so new Canary/Nightly/Stable APKs trigger module pre-releases.
    - cron: "*/30 * * * *"
  repository_dispatch:
    types:
      - nectarlink-canary
      - nectarlink-nightly
      - nectarlink-release
  workflow_dispatch:
    inputs:
      services_ref:
        description: Git ref for isaiahscape/nectarlink-services
        required: false
        default: "main"
      nectarlink_channel:
        description: thtbee/nectarlink APK channel(s) to bundle
        type: choice
        options:
          - canary-nightly-and-stable
          - nightly-and-stable
          - canary-and-stable
          - canary
          - nightly
          - stable
          - none
        required: false
        default: "canary-nightly-and-stable"
      version:
        description: Override module/APK version (optional, e.g. 0.1.6)
        required: false
        default: ""
      create_prerelease:
        description: Publish or update a GitHub pre-release from this manual run
        type: boolean
        required: false
        default: false
      release_tag:
        description: Pre-release tag when publishing (default v<version>-nightly)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve Build Plan & Upstream State
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.plan.outputs.due }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      channels: ${{ steps.plan.outputs.channels }}
      publish_prerelease: ${{ steps.plan.outputs.publish_prerelease }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      upstream_state_json: ${{ steps.plan.outputs.upstream_state_json }}
      prerelease_notes: ${{ steps.plan.outputs.prerelease_notes }}
    steps:
      - name: Checkout module
        uses: actions/checkout@v7

      - name: Resolve version, channels & upstream trigger state
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_SERVICES_REF: ${{ github.event.inputs.services_ref }}
          INPUT_CHANNEL: ${{ github.event.inputs.nectarlink_channel }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CREATE_PRE: ${{ github.event.inputs.create_prerelease }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          MODULE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROP_VER="$(grep -E '^version=' module.prop | cut -d= -f2- | sed 's/^v//')"
          PROP_CODE="$(grep -E '^versionCode=' module.prop | cut -d= -f2-)"

          # Inspect upstream thtbee/nectarlink releases + isaiahscape/nectarlink-services main SHA.
          gh api "repos/thtbee/nectarlink/releases?per_page=30" > /tmp/upstream_releases.json
          gh api "repos/thtbee/nectarlink/releases/latest" > /tmp/upstream_latest.json || echo '{}' > /tmp/upstream_latest.json
          SERVICES_SHA="$(gh api "repos/isaiahscape/nectarlink-services/commits/${INPUT_SERVICES_REF:-main}" --jq '.sha')"

          UPSTREAM_META="$(python3 - <<'PY'
          import json
          import re

          with open("/tmp/upstream_releases.json", "r", encoding="utf-8") as fh:
              releases = json.load(fh)
          with open("/tmp/upstream_latest.json", "r", encoding="utf-8") as fh:
              stable = json.load(fh)

          def find_apk(rel):
              for a in rel.get("assets", []):
                  if re.match(r"^Nectarlink-.*-android\.apk$", a.get("name", "")):
                      digest = (a.get("digest") or "").removeprefix("sha256:")
                      return a.get("name", ""), digest, str(a.get("id", ""))
              return "", "", ""

          canary_rel = next((r for r in releases if not r.get("draft") and r.get("tag_name") == "canary"), None)
          nightly_rel = next(
              (r for r in releases if not r.get("draft") and r.get("prerelease")
               and re.match(r"^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$", r.get("tag_name", ""))),
              None,
          )

          base_ver = ""
          if nightly_rel:
              m = re.match(r"^v([0-9]+\.[0-9]+\.[0-9]+)-nightly\.", nightly_rel["tag_name"])
              if m:
                  base_ver = m.group(1)

          canary_name, canary_sha, canary_id = find_apk(canary_rel or {})
          nightly_name, nightly_sha, nightly_id = find_apk(nightly_rel or {})
          stable_name, stable_sha, stable_id = find_apk(stable or {})

          state = {
              "canary_title": (canary_rel or {}).get("name", ""),
              "canary_commit": ((canary_rel or {}).get("target_commitish") or "")[:7],
              "canary_sha256": canary_sha or canary_id,
              "nightly_tag": (nightly_rel or {}).get("tag_name", ""),
              "nightly_sha256": nightly_sha or nightly_id,
              "stable_tag": (stable or {}).get("tag_name", ""),
              "stable_sha256": stable_sha or stable_id,
              "base_version": base_ver,
          }
          print(json.dumps(state, sort_keys=True))
          PY
          )"

          BASE_VER="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("base_version",""))' "$UPSTREAM_META")"
          VER="$INPUT_VERSION"
          if [ -z "$VER" ] && [[ "$FULL_REF" == refs/tags/v* ]]; then
            VER="${REF_NAME#v}"
          fi
          VER="${VER:-${BASE_VER:-${PROP_VER:-0.1.0}}}"

          CODE="${PROP_CODE:-1}"
          if [ "$RUN_NUMBER" -gt "$CODE" ] 2>/dev/null; then
            CODE="$RUN_NUMBER"
          fi

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            CHANNEL="canary-nightly-and-stable"
          else
            CHANNEL="${INPUT_CHANNEL:-nightly-and-stable}"
          fi

          case "$CHANNEL" in
            canary-nightly-and-stable) CHANNELS="canary nightly stable" ;;
            nightly-and-stable)        CHANNELS="nightly stable" ;;
            canary-and-stable)         CHANNELS="canary stable" ;;
            canary|nightly|stable|none) CHANNELS="$CHANNEL" ;;
            *)
              echo "Unsupported nectarlink_channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

          PUBLISH_PRE="false"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            PUBLISH_PRE="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$INPUT_CREATE_PRE" = "true" ] || [ "$INPUT_CREATE_PRE" = "1" ]; }; then
            PUBLISH_PRE="true"
          fi

          REL_TAG="${INPUT_RELEASE_TAG:-v${VER}-nightly}"

          FULL_STATE="$(python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          s["services_sha"] = sys.argv[2]
          s["module_sha"] = sys.argv[3]
          print(json.dumps(s, sort_keys=True))
          ' "$UPSTREAM_META" "$SERVICES_SHA" "${MODULE_SHA:0:7}")"

          DUE="true"
          if [ "$EVENT_NAME" = "schedule" ]; then
            DUE="false"
            PREV_STATE="{}"
            if gh release download "$REL_TAG" --repo "$GITHUB_REPOSITORY" --pattern "upstream-state.json" --dir /tmp --clobber 2>/dev/null; then
              PREV_STATE="$(cat /tmp/upstream-state.json)"
            fi
            DUE="$(python3 -c '
          import json, sys
          cur = json.loads(sys.argv[1])
          prev = json.loads(sys.argv[2])
          keys = ("canary_sha256", "nightly_tag", "nightly_sha256", "stable_tag", "stable_sha256")
          changed = [k for k in keys if cur.get(k) != prev.get(k)]
          if changed:
              sys.stderr.write("Upstream thtbee/nectarlink changed: " + ", ".join(changed) + "\n")
              print("true")
          else:
              sys.stderr.write("No new thtbee/nectarlink canary, nightly, or stable release.\n")
              print("false")
          ' "$FULL_STATE" "$PREV_STATE")"
          fi

          NOTES="$(python3 -c '
          import json, sys
          s = json.loads(sys.argv[1])
          lines = [
              "Automated pre-release module packages built against signed **thtbee/nectarlink** client APKs and **Nectarlink Services** (`sn.nectarlink.services`).",
              "",
              "| Bundle | Upstream Build | Commit / Tag |",
              "|---|---|---|",
              f"| `*-canary.zip` | `{s.get(\"canary_title\") or \"canary\"}` | `{s.get(\"canary_commit\") or \"canary\"}` |",
              f"| `*-nightly.zip` | Nightly | `{s.get(\"nightly_tag\") or \"none\"}` |",
              f"| `*-stable.zip` | Stable | `{s.get(\"stable_tag\") or \"none\"}` |",
              "",
              f"- **Nectarlink Services:** `isaiahscape/nectarlink-services` @ `{s.get(\"services_sha\", \"\")[:7]}`",
              f"- **Nectarlink Module:** `isaiahscape/nectarlink-module` @ `{s.get(\"module_sha\", \"\")[:7]}`",
          ]
          print("\n".join(lines))
          ' "$FULL_STATE")"

          {
            echo "due=$DUE"
            echo "version=$VER"
            echo "version_code=$CODE"
            echo "channels=$CHANNELS"
            echo "publish_prerelease=$PUBLISH_PRE"
            echo "release_tag=$REL_TAG"
            echo "upstream_state_json=$FULL_STATE"
            echo "prerelease_notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build APKs & Module Zip
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v7

      - name: Checkout nectarlink-services
        uses: actions/checkout@v7
        with:
          repository: isaiahscape/nectarlink-services
          ref: ${{ github.event.inputs.services_ref || 'main' }}
          path: src/nectarlink-services

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "16111833"
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "NECTARLINK_SERVICES_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "NECTARLINK_SERVICES_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NECTARLINK_SERVICES_KEY_ALIAS=${KEY_ALIAS:-nectarlink}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Nectarlink Services APK
        working-directory: src/nectarlink-services
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest :service:lintDebug :service:assembleRelease \
            -Pservices.version="${{ needs.plan.outputs.version }}" \
            -Pservices.versionCode="${{ needs.plan.outputs.version_code }}"

      - name: Fetch upstream Nectarlink APKs and build flashable module zip(s)
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_JSON: ${{ needs.plan.outputs.upstream_state_json }}
        run: |
          set -euo pipefail
          mkdir -p out
          SVC_SRC="src/nectarlink-services/service/build/outputs/apk/release/service-release.apk"
          SVC_DEST="system/system_ext/priv-app/NectarlinkServices/NectarlinkServices.apk"
          APP_DEST="system/product/app/Nectarlink/Nectarlink.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          FETCH="src/nectarlink-services/aosp/fetch-client-apk.sh"
          chmod +x "$FETCH"

          if [ ! -f "$SVC_SRC" ] || [ "$(stat -c%s "$SVC_SRC")" -lt 1024 ]; then
            echo "Built NectarlinkServices APK is missing or too small" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$SVC_SRC"
          cp "$SVC_SRC" "$SVC_DEST"
          cp "$SVC_SRC" out/NectarlinkServices.apk

          sed -i "s/^version=.*/version=v${{ needs.plan.outputs.version }}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ needs.plan.outputs.version_code }}/" module.prop

          chmod +x action.sh customize.sh post-fs-data.sh service.sh uninstall.sh META-INF/com/google/android/update-binary

          for ch in ${{ needs.plan.outputs.channels }}; do
            if [ "$ch" = "none" ]; then
              rm -f "$APP_DEST"
              ZIP_NAME="nectarlink-services-v${{ needs.plan.outputs.version }}.zip"
            else
              CLIENT_DIR="out/client-${ch}"
              sh "$FETCH" --channel "$ch" --dest "$CLIENT_DIR"
              APP_SRC="${CLIENT_DIR}/Nectarlink.apk"
              if [ ! -f "$APP_SRC" ] || [ "$(stat -c%s "$APP_SRC")" -lt 1024 ]; then
                echo "Fetched Nectarlink (${ch}) APK is missing or too small" >&2
                exit 1
              fi
              "$APKSIGNER" verify --print-certs "$APP_SRC"
              cp "$APP_SRC" "$APP_DEST"
              cp "$APP_SRC" "out/Nectarlink-${ch}.apk"
              ZIP_NAME="nectarlink-services-v${{ needs.plan.outputs.version }}-${ch}.zip"
            fi

            rm -f "out/$ZIP_NAME"
            zip -r9 "out/$ZIP_NAME" . \
              -x ".git/*" ".git" ".github/*" ".github" "src/*" "src" "out/*" "out" ".gitignore" ".gitattributes"

            unzip -l "out/$ZIP_NAME" | grep -E "^\s+[0-9]+.*\smodule\.prop$"
            unzip -l "out/$ZIP_NAME" | grep "NectarlinkServices.apk"
            if [ "$ch" != "none" ]; then
              unzip -l "out/$ZIP_NAME" | grep "Nectarlink.apk"
            fi
          done

          (cd out && rm -f SHA256SUMS.txt && sha256sum *.zip *.apk > SHA256SUMS.txt)
          printf '%s\n' "$STATE_JSON" > out/upstream-state.json
          cat out/SHA256SUMS.txt

      - name: Clean up signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nectarlink-module-v${{ needs.plan.outputs.version }}
          path: |
            out/*.zip
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip out/*.apk out/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Create or update GitHub Pre-release
        if: needs.plan.outputs.publish_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.release_tag }}
          PRE_NOTES: ${{ needs.plan.outputs.prerelease_notes }}
        run: |
          printf '%s\n' "$PRE_NOTES" > /tmp/prerelease_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.zip out/*.apk out/SHA256SUMS.txt out/upstream-state.json --clobber
            if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
              gh release edit "$TAG" --notes-file /tmp/prerelease_notes.md
            fi
          else
            gh release create "$TAG" out/*.zip out/*.apk out/SHA256SUMS.txt out/upstream-state.json \
              --prerelease \
              --title "Nectarlink Services Root Module — Pre-release ($TAG)" \
              --notes-file /tmp/prerelease_notes.md
          fi
